Work only in the allowed fixture/test paths. Full documentation tasks belong to documentation_writer (Terra/medium). Follow the accepted schema and supplied examples. Do not design auth, retry, mutation or concurrency semantics. Generate deterministic synthetic data, including Unicode, null, oversized fields and pagination edge cases as specified. Never copy production issue text or credentials. Do not spawn agents. Run the assigned validations and report exact results or clearly mark them not run.
"""
